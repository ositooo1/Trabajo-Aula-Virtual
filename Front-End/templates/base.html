<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Aula Virtual{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Nuestro CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="app">

        <!--SIDEBAR de aura-->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <div class="brand-icon">
                    AV
                </div>

                <div>
                    <h2>Aula Virtual</h2>
                    <span>Plataforma educativa</span>
                </div>
            </div>

            <nav class="sidebar-nav">

                <a href="/" class="sidebar-link">
                    Inicio
                </a>

                <a href="/dashboard" class="sidebar-link">
                    Dashboard
                </a>

                <a href="/courses" class="sidebar-link">
                    Mis Cursos
                </a>

            </nav>

            <div class="user-section">

                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">
                        U
                    </div>

                    <div>
                        <span id="userName">Usuario</span>
                        <small>Mi cuenta</small>
                    </div>
                </div>

                <button
                    type="button"
                    class="btn-logout"
                    onclick="logout()"
                >
                    Cerrar sesión
                </button>

            </div>

        </aside>


        <!--CONTENIDOS princ.-->
        <main class="main">

            <!-- Header móvil -->
            <div class="mobile-header">
                <strong>Aula Virtual</strong>

                <button
                    class="btn btn-success btn-sm"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#mobileMenu"
                >
                    Menú
                </button>
            </div>


            <div class="container-fluid">

                <div id="alerts"></div>

                {% block content %}
                {% endblock %}

            </div>

        </main>

    </div>


    <!-- MENÚ CELULAR-->
    <div
        class="offcanvas offcanvas-start"
        tabindex="-1"
        id="mobileMenu"
    >

        <div class="offcanvas-header">

            <h5 class="offcanvas-title">
                Aula Virtual
            </h5>

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
            ></button>

        </div>

        <div class="offcanvas-body">

            <nav class="mobile-nav">

                <a href="/">
                    Inicio
                </a>

                <a href="/dashboard">
                    Dashboard
                </a>

                <a href="/courses">
                    Mis Cursos
                </a>

                <hr>

                <button
                    type="button"
                    class="btn btn-outline-danger w-100"
                    onclick="logout()"
                >
                    Cerrar sesión
                </button>

            </nav>

        </div>

    </div>


    <!--MODAL-->
    <div
        class="modal fade"
        id="appModal"
        tabindex="-1"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="modalTitle"
                    ></h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div
                    class="modal-body"
                    id="modalBody"
                ></div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- JS general -->
    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>


    <script>

        const u = getUser();

        if (u) {

            const nombre = u.username || 'Usuario';

            document.getElementById('userName').textContent = nombre;

            document.getElementById('userAvatar').textContent =
                nombre.charAt(0).toUpperCase();

        }

    </script>


    {% block scripts %}
    {% endblock %}

</body>
</html>
