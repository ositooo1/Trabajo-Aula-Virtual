<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - Aula Virtual</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- CSS propio -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="auth-page">


    <div class="auth-box">


        <!--  ENCABEZADO.-->

        <div class="text-center mb-4">

            <div
                class="brand-icon mx-auto mb-3"
                style="width: 52px; height: 52px;"
            >
                AV
            </div>

            <h1>
                Bienvenido
            </h1>

            <p class="mb-0">
                Iniciá sesión para continuar en Aula Virtual
            </p>

        </div>


        <!-- ALERTAS.-->

        <div id="alerts"></div>


        <!-- FORMS-->

        <form id="loginForm">


            <!-- Email -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required
                    maxlength="150"
                    autocomplete="email"
                    placeholder="tu@email.com"
                >

            </div>


            <!-- Contraseña -->

            <div class="mb-4">

                <label
                    for="password"
                    class="form-label"
                >
                    Contraseña
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="Tu contraseña"
                >

            </div>


            <!-- Botón -->

            <button
                type="submit"
                class="btn btn-primary w-100"
                id="loginButton"
            >
                Iniciar sesión
            </button>


        </form>


        <!-- REGISTRO.-->

        <div class="text-center mt-4">

            <p class="mb-0">

                ¿Todavía no tenés una cuenta?

                <a
                    href="/register"
                    class="fw-semibold"
                >
                    Crear cuenta
                </a>

            </p>

        </div>


    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Funciones generales -->
    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>


    <!-- Login -->
    <script>

        const loginForm =
            document.getElementById('loginForm');


        const loginButton =
            document.getElementById('loginButton');


        loginForm.addEventListener(
            'submit',
            async function(event) {


                /*
                    Evitamos la recarga normal
                    del formulario.
                */

                event.preventDefault();


                /*
                    Leemos los valores.
                */

                const email =
                    document
                        .getElementById('email')
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById('password')
                        .value;


                /*
                    Validación rápida del frontend.
                */

                if (!email) {

                    showAlert(
                        'Ingresá tu email.',
                        'error'
                    );

                    return;
                }


                if (!password) {

                    showAlert(
                        'Ingresá tu contraseña.',
                        'error'
                    );

                    return;
                }


                /*
                    Evitamos múltiples envíos.
                */

                loginButton.disabled = true;

                loginButton.textContent =
                    'Ingresando...';


                /*
                    app.js convierte esto en:

                    POST /api/login
                */

                const response =
                    await api(
                        '/login',
                        'POST',
                        {
                            email: email,
                            password: password
                        }
                    );


                /*
                    Si el login fue correcto,
                    el backend nos entrega:

                    {
                        token: "...",
                        user: {...}
                    }
                */

                if (response) {


                    /*
                        Guardamos el token.

                        Lo utilizará api() automáticamente
                        para las próximas peticiones.
                    */

                    localStorage.setItem(
                        'token',
                        response.token
                    );


                    /*
                        Guardamos también datos básicos
                        del usuario.

                        NO guardamos la contraseña.
                    */

                    localStorage.setItem(
                        'user',
                        JSON.stringify(
                            response.user
                        )
                    );


                    /*
                        Enviamos al usuario al inicio.

                        Uso "/" en lugar de "/dashboard"
                        porque más adelante la homepage
                        será realmente "Mis Cursos".
                    */

                    window.location.href = '/';

                    return;
                }


                /*
                    Si Flask rechazó el login,
                    habilitamos nuevamente el botón.
                */

                loginButton.disabled = false;

                loginButton.textContent =
                    'Iniciar sesión';


            }
        );

    </script>


</body>

</html>
