{% extends "base.html" %}
{% block title %}Evaluaciones{% endblock %}

{% block content %}
<div class="flex mb">
    <h1 style="flex:1">Evaluaciones</h1>
    <button class="btn btn-primary" onclick="crear()">+ Nueva Evaluacion</button>
</div>

<div id="lista"></div>
{% endblock %}

{% block scripts %}
<script>
let evaluaciones = [];
let cursos = [];

async function cargar() {
    const data = await api('/evaluations');
    evaluaciones = data ? (data.evaluations || data || []) : [];
    const cData = await api('/courses');
    cursos = cData ? (cData.courses || cData || []) : [];
    mostrar();
}

function mostrar() {
    const el = document.getElementById('lista');
    if (!evaluaciones.length) { el.innerHTML = '<p>No hay evaluaciones.</p>'; return; }
    el.innerHTML = '<table><tr><th>ID</th><th>Titulo</th><th>Tipo</th><th>Curso</th><th>Puntaje</th><th>Acciones</th></tr>' +
        evaluaciones.map(e => `<tr>
            <td>${e.id}</td>
            <td>${e.title}</td>
            <td>${e.type || '-'}</td>
            <td>${e.course_name || '-'}</td>
            <td>${e.max_score || 10}</td>
            <td>
                <button class="btn btn-secondary btn-small" onclick="editar(${e.id})">Editar</button>
                <button class="btn btn-danger btn-small" onclick="eliminar(${e.id})">Eliminar</button>
            </td>
        </tr>`).join('') + '</table>';
}

function optsCourses(selected) {
    return '<option value="">Seleccionar curso...</option>' +
        cursos.map(c => `<option value="${c.id}" ${selected == c.id ? 'selected' : ''}>${c.name}</option>`).join('');
}

function form(e) {
    return `
        <div class="form-group"><label>Titulo *</label><input id="fTitle" value="${e ? e.title : ''}"></div>
        <div class="form-group"><label>Tipo *</label>
            <select id="fType">
                <option value="">Seleccionar...</option>
                <option value="examen" ${e && e.type === 'examen' ? 'selected' : ''}>Examen</option>
                <option value="parcial" ${e && e.type === 'parcial' ? 'selected' : ''}>Parcial</option>
                <option value="final" ${e && e.type === 'final' ? 'selected' : ''}>Final</option>
                <option value="practica" ${e && e.type === 'practica' ? 'selected' : ''}>Practica</option>
                <option value="quiz" ${e && e.type === 'quiz' ? 'selected' : ''}>Quiz</option>
                <option value="tarea" ${e && e.type === 'tarea' ? 'selected' : ''}>Tarea</option>
            </select>
        </div>
        <div class="form-group"><label>Curso *</label><select id="fCourse">${optsCourses(e ? e.course_id : '')}</select></div>
        <div class="form-group"><label>Puntaje maximo</label><input id="fScore" type="number" value="${e ? e.max_score || 10 : 10}"></div>
        <div class="form-group"><label>Fecha limite</label><input id="fDate" type="date" value="${e ? e.due_date || '' : ''}"></div>
        <div class="form-group"><label>Descripcion</label><textarea id="fDesc">${e ? e.description || '' : ''}</textarea></div>
        <button class="btn btn-primary" onclick="guardar(${e ? e.id : 0})">Guardar</button>`;
}

function crear() { showModal('Nueva Evaluacion', form(null)); }

function editar(id) {
    const e = evaluaciones.find(x => x.id === id);
    showModal('Editar Evaluacion', form(e));
}

async function guardar(id) {
    const datos = {
        title: document.getElementById('fTitle').value,
        type: document.getElementById('fType').value,
        course_id: document.getElementById('fCourse').value,
        max_score: document.getElementById('fScore').value,
        due_date: document.getElementById('fDate').value,
        description: document.getElementById('fDesc').value
    };
    if (!datos.title || !datos.type || !datos.course_id) { showAlert('Titulo, tipo y curso son obligatorios', 'error'); return; }
    if (id) await api('/evaluations/' + id, 'PUT', datos);
    else await api('/evaluations', 'POST', datos);
    closeModal();
    cargar();
}

async function eliminar(id) {
    if (!confirm('Eliminar esta evaluacion?')) return;
    await api('/evaluations/' + id, 'DELETE');
    cargar();
}

cargar();
</script>
{% endblock %}
